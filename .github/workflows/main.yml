name: weixin

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions 使用 UTC 时间
    # 北京时间晚上10点 = UTC 下午2点
    - cron: '0 14 * * *'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show files
        run: |
          echo "当前目录："
          pwd
          echo "文件列表："
          ls -la
          echo ".github/workflows 文件："
          ls -la .github/workflows || true
          echo "main.py 前20行："
          sed -n '1,20p' main.py || true
          echo "config.txt 前30行："
          sed -n '1,30p' config.txt || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install pip packages
        run: |
          python -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Run weixin push
        run: |
          python3 -u main.py
